# ComfyUI model search paths.
# RunPod Network Volumes mount at /runpod-volume by default.
# Layout (seed once with seed_volume.sh / download_models.sh):
#   /runpod-volume/models/diffusion_models/
#   /runpod-volume/models/loras/
#   /runpod-volume/models/text_encoders/
#   /runpod-volume/models/vae/
#   /runpod-volume/models/clip_vision/
#   /runpod-volume/loras/   (optional extra user LoRAs)

comfyui:
    base_path: /ComfyUI/
    is_default: true
    checkpoints: models/checkpoints/
    clip: |
        models/text_encoders
        models/clip
        /runpod-volume/models/text_encoders
    clip_vision: |
        models/clip_vision
        /runpod-volume/models/clip_vision
    configs: models/configs/
    controlnet: models/controlnet/
    diffusion_models: |
        models/diffusion_models
        models/unet
        /runpod-volume/models/diffusion_models
    embeddings: models/embeddings/
    loras: |
        models/loras
        /runpod-volume/models/loras
        /runpod-volume/loras
    text_encoders: |
        models/text_encoders
        /runpod-volume/models/text_encoders
    upscale_models: models/upscale_models/
    vae: |
        models/vae
        /runpod-volume/models/vae
